<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Inicialización ultra rápida de estilo del sistema / usuario desde localStorage (previene FOUC) -->
		<script>
			(function () {
				try {
					var uid = localStorage.getItem('logistic_current_user_id');
					var userRaw = uid ? localStorage.getItem('logistic_user_style_' + uid) : null;
					var raw = userRaw || localStorage.getItem('logistic_system_style');
					if (raw) {
						var s = JSON.parse(raw);
						var r = document.documentElement;
						if (s.color_primary) r.style.setProperty('--primary', s.color_primary);
						if (s.color_primary_foreground) r.style.setProperty('--primary-foreground', s.color_primary_foreground);
						if (s.color_accent) r.style.setProperty('--accent', s.color_accent);
						if (s.color_accent_foreground) r.style.setProperty('--accent-foreground', s.color_accent_foreground);
						if (s.border_radius) r.style.setProperty('--radius', s.border_radius);
						if (s.sidebar_theme === 'dark') {
							r.style.setProperty('--sidebar', 'oklch(0.16 0 0)');
							r.style.setProperty('--sidebar-foreground', 'oklch(0.985 0 0)');
							r.style.setProperty('--sidebar-border', 'oklch(0.24 0 0)');
						} else if (s.sidebar_theme === 'primary' && s.color_primary) {
							r.style.setProperty('--sidebar', s.color_primary);
							r.style.setProperty('--sidebar-foreground', s.color_primary_foreground || 'oklch(0.985 0 0)');
						}
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
